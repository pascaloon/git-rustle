[package]
name = "git-rustle"
version = "0.1.0"
edition = "2024"
description = "Fast Windows-native GPU-accelerated Git client"
license = "MIT"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
gpui-component = "=0.5.1"
async-channel = "2"
futures-lite = "2"
gix = { version = "0.89", default-features = false, features = ["max-performance-safe", "sha1"] }
unicode-width = "0.2"
imara-diff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Credentials",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
