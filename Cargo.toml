[package]
name = "git-rustle"
version = "0.1.6"
edition = "2024"
description = "Fast Windows-native GPU-accelerated Git client"
license = "GPL-3.0-only"

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
gpui-component = { version = "=0.5.1", features = ["tree-sitter-languages"] }
tree-sitter-highlight = "=0.25.10"
tree-sitter-javascript = "=0.23.1"
tree-sitter-cmake = "=0.7.5"
tree-sitter-batch = "=0.11.1"
tree-sitter-powershell = "=0.26.4"
tree-sitter-c-sharp = "=0.23.5"
xmlparser = "=0.13.6"
async-channel = "2"
futures-lite = "2"
gix = { version = "0.89", default-features = false, features = ["max-performance-safe", "sha1", "attributes"] }
unicode-width = "0.2"
imara-diff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
url = "2"
self_update = { version = "=1.3.1", default-features = false, features = ["github", "ureq", "native-tls", "checksums"] }

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"

[build-dependencies]
embed-resource = "=3.0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Credentials",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.fast]
inherits = "release"
lto = "off"
codegen-units = 16

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
