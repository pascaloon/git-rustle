name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and test Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust (Windows x64 MSVC)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add x86_64-pc-windows-msvc --toolchain stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc +stable --version --verbose
          cargo +stable --version

      - name: Restore Rust build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-msvc-rust-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-msvc-rust-

      - name: Build release executable and record build timing
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          cargo +stable build --release --locked --target x86_64-pc-windows-msvc --bin git-rustle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $timer.Stop()
          $exe = Get-Item 'target/x86_64-pc-windows-msvc/release/git-rustle.exe'
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            '## Windows release build',
            "- Commit: $env:GITHUB_SHA",
            "- Ref: $env:GITHUB_REF",
            "- Release build (with available cache, including dependency downloads): $($timer.Elapsed.TotalSeconds.ToString('F3')) s",
            "- Executable size: $($exe.Length) bytes",
            "- SHA-256: $hash",
            '- Build timing measures CI throughput, not application runtime performance.'
          ) | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Validate release version
        run: |
          $metadata = cargo +stable metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ($metadata.packages | Where-Object name -eq 'git-rustle').version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag must be v$version to match Cargo.toml"
          }
          # PowerShell does not wait for a Windows GUI-subsystem executable.
          # Keep its stdout open until it exits, then validate the captured value.
          $process = Start-Process -FilePath './target/x86_64-pc-windows-msvc/release/git-rustle.exe' -ArgumentList '--version' -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput version.txt -RedirectStandardError version-error.txt
          $reported = (Get-Content -LiteralPath version.txt -Raw).Trim()
          if ($process.ExitCode -ne 0 -or $reported -cne "git-rustle $version") {
            throw 'Executable version does not match Cargo.toml'
          }

      - name: Run release-mode tests
        run: |
          cargo +stable test --release --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test release executable
        run: |
          $process = Start-Process -FilePath './target/x86_64-pc-windows-msvc/release/git-rustle.exe' -ArgumentList '--help' -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput help.txt -RedirectStandardError help-error.txt
          if ($process.ExitCode -ne 0 -or (Get-Content -LiteralPath help.txt -Raw) -notmatch 'Usage:') {
            throw 'Executable help smoke check failed'
          }

      - name: Upload single release executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/x86_64-pc-windows-msvc/release/git-rustle.exe
          archive: false
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: false

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $asset = 'git-rustle-x86_64-pc-windows-msvc.exe'
          Copy-Item -LiteralPath 'target/x86_64-pc-windows-msvc/release/git-rustle.exe' -Destination $asset
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding utf8NoBOM SHA256SUMS
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) {
              throw 'This release is already published. Publish a new version instead of replacing its assets.'
            }
            gh release upload $tag $asset SHA256SUMS --clobber
          } else {
            gh release create $tag $asset SHA256SUMS --verify-tag --draft --generate-notes --title $tag
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; no release was published.' }
          # Publish only after every asset is uploaded. Previews stay out of /releases/latest.
          $flags = @()
          if ($tag.Contains('-')) { $flags += @('--prerelease', '--latest=false') }
          gh release edit $tag --draft=false @flags
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
